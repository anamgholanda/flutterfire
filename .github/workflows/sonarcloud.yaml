name: sonarcloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: Análise SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo, necessário para o Sonar

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Resolve as dependências de TODOS os pacotes (inclusive os sem testes) antes da
      # análise. Sem isso o analisador Dart não encontra os pacotes importados e gera
      # milhares de erros "Undefined name/class" (regra dart:S2260).
      - name: Resolver dependências de todos os pacotes
        run: |
          set -uo pipefail
          ok=0; failed=0
          : > "$RUNNER_TEMP/pub_failed.txt"

          while IFS= read -r pubspec; do
            pkg="$(dirname "$pubspec")"
            echo "::group::pub get em $pkg"
            if (cd "$pkg" && flutter pub get); then
              ok=$((ok+1))
            else
              failed=$((failed+1))
              echo "$pkg" >> "$RUNNER_TEMP/pub_failed.txt"
              echo "::warning::pub get falhou em $pkg"
            fi
            echo "::endgroup::"
          done < <(find packages -name pubspec.yaml \
                     -not -path "*/.dart_tool/*" \
                     -not -path "*/build/*" \
                     -not -path "*/ephemeral/*" \
                     -not -path "*/.symlinks/*" \
                     -not -path "*/node_modules/*" -not -path "*/example/*" | sort)

          {
            echo "### Resolução de dependências"
            echo "- Pacotes resolvidos: $ok"
            echo "- Pacotes com falha: $failed"
            if [ "$failed" -gt 0 ]; then
              echo ""; echo "Sem dependências resolvidas (a análise deles terá ruído):"; echo '```'
              cat "$RUNNER_TEMP/pub_failed.txt"; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Resolvidos: $ok | Falharam: $failed"

      - name: Testes com cobertura (todos os pacotes)
        run: |
          set -uo pipefail
          mkdir -p coverage
          : > coverage/lcov.info

          while IFS= read -r pubspec; do
            pkg="$(dirname "$pubspec")"
            [ -d "$pkg/test" ] || continue
            grep -q "sdk: flutter" "$pubspec" || continue

            echo "::group::$pkg"
            (
              cd "$pkg"
              flutter test --coverage
            ) || echo "::warning::Falha nos testes de $pkg"

            # Reescreve os caminhos (SF:) para ficarem relativos à raiz do repositório
            if [ -f "$pkg/coverage/lcov.info" ]; then
              sed "s|^SF:|SF:${pkg#./}/|" "$pkg/coverage/lcov.info" >> coverage/lcov.info
            fi
            echo "::endgroup::"
          done < <(find packages -name pubspec.yaml \
                     -not -path "*/.dart_tool/*" \
                     -not -path "*/build/*" \
                     -not -path "*/ephemeral/*" \
                     -not -path "*/.symlinks/*" \
                     -not -path "*/node_modules/*" -not -path "*/example/*" | sort)

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=anamgholanda
            -Dsonar.projectKey=anamgholanda_flutterfire
            -Dsonar.projectName=flutterfire
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.sources=packages
            -Dsonar.inclusions=packages/**/lib/**/*.dart
            -Dsonar.exclusions=**/example/**,**/*.g.dart,**/*.g.h,**/*.g.cpp,**/*.g.swift,**/*.freezed.dart,**/generated/**,**/*.pb.dart,**/.dart_tool/**
            -Dsonar.tests=packages
            -Dsonar.test.inclusions=packages/**/test/**/*.dart
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}